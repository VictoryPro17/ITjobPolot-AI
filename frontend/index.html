<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="JobPilot AI - intelligenter Bewerbungsmanager" />
    <title>JobPilot AI</title>
    <script>
      // Verhindert ein Aufblitzen des hellen Themes beim Laden.
      (function () {
        try {
          var stored = localStorage.getItem("jobpilot.theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (stored === "dark" || (stored !== "light" && prefersDark)) {
            document.documentElement.classList.add("dark");
          }
        } catch (error) {
          /* localStorage kann blockiert sein - dann bleibt das Light-Theme aktiv. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
