services:
  postgres:
    image: postgres:17-alpine
    container_name: jobpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobpilot
      POSTGRES_USER: jobpilot
      # Nur fuer die lokale Entwicklung. Produktive Zugangsdaten gehoeren
      # in Umgebungsvariablen bzw. einen Secret-Store, niemals ins Repository.
      POSTGRES_PASSWORD: jobpilot_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobpilot -d jobpilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Test-Mailserver fuer die Entwicklung: faengt alle E-Mails ab, nichts verlaesst den Rechner.
  # Posteingang im Browser: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21.8
    container_name: jobpilot-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres-data: